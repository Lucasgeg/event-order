services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_order_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "55432:5432"
    volumes:
      - event_order_test_pgdata:/var/lib/postgresql/data

volumes:
  event_order_test_pgdata:
